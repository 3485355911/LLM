# ======================================================================
#  配置示例（本文件不含任何真实密钥，可安全提交）
#  用法：复制本文件为同目录的 config.ini，填入自己的 Key 后运行。
#        config.ini 已被 .gitignore 排除，不会被提交。
# ======================================================================

[llm]
# 模型 API Key（必填）。也可用环境变量 LAGENT_API_KEY 注入，优先级高于本文件。
api_key = sk-请替换为你的APIKey

# 接口地址（也可用环境变量 LAGENT_BASE_URL 覆盖）
#   DeepSeek:   https://api.deepseek.com/v1
#   OpenAI:     https://api.openai.com/v1
#   硅基流动:   https://api.siliconflow.cn/v1
base_url = https://api.deepseek.com/v1

# 模型名称（也可用环境变量 LAGENT_MODEL 覆盖）
model_name = deepseek-chat
