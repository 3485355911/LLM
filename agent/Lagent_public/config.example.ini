# ======================================================================
#  Lagent 配置示例
#  用法：复制本文件为 config.ini，填入自己的 Key 后启动。
#  注意：config.ini 已被 .gitignore 排除，不会上传到 GitHub；
#        本文件不含任何真实密钥，可以安全提交。
# ======================================================================

[llm]
# 模型 API Key（必填）。也可以改用环境变量 LAGENT_API_KEY 注入，优先级高于本文件。
api_key = sk-请替换为你的APIKey

# 模型提供商地址（也可用环境变量 LAGENT_BASE_URL 覆盖）
#   DeepSeek:   https://api.deepseek.com/v1
#   OpenAI:     https://api.openai.com/v1
#   硅基流动:   https://api.siliconflow.cn/v1
base_url = https://api.deepseek.com/v1

# 模型名称（也可用环境变量 LAGENT_MODEL 覆盖）
#   deepseek-chat / deepseek-reasoner / gpt-4o / qwen-plus / ...
model_name = deepseek-chat

# API 请求超时（秒）
timeout = 120

# 可选：温度 0~2，注释掉即使用模型默认值
; temperature = 0.3

# 可选：上下文窗口大小（tokens）
; context_window = 128000

# 可选：单次提问最多推理轮次
; max_rounds = 12

# 可选：千帆 apikey（百度 Qianfan 搜索工具用，也可用环境变量 BAIDU_QIANFAN_APIKEY）
; baidu_qianfan_apikey =
