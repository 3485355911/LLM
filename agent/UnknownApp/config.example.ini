# ======================================================================
#  UnknownApp 配置示例（本文件不含任何真实密钥，可安全提交）
#  用法：复制本文件为同目录的 config.ini，填入自己的 Key 后运行。
# ======================================================================

[llm]
# 模型 API Key（必填）
api_key = sk-请替换为你的APIKey

# 百度千帆 apikey（可选，Qianfan 搜索工具使用）
# 在百度智能云千帆控制台创建应用后获取，形如 bce-v3/你的令牌
; baidu_qianfan_apikey =

# 接口地址
base_url = https://api.deepseek.com/v1

# 模型名称
model_name = deepseek-chat

; 可选配置
timeout = 120
; temperature = 0.3
