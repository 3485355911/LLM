<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnythingLLM 文档上传</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 18px; margin-bottom: 16px; }
  .row { margin-bottom: 12px; }
  button { padding: 6px 14px; cursor: pointer; }
  button:disabled { cursor: default; opacity: .6; }
  select { padding: 4px; }
  #status { margin-top: 12px; padding: 10px; background: #f5f5f5; border-radius: 4px; white-space: pre-wrap; word-break: break-all; font-size: 13px; min-height: 20px; }
  .ok { color: #1a7f37; } .err { color: #b00020; } .info { color: #555; }
</style>
</head>
<body>
  <h1>上传文档到 AnythingLLM 工作区（含向量化嵌入）</h1>
  <div class="row"><label>工作区：<select id="ws" disabled></select></label></div>
  <div class="row"><input type="file" id="file"></div>
  <div class="row"><button id="btn" disabled>上传并嵌入</button></div>
  <div id="status" class="info">正在加载工作区…</div>

<script>
const API_BASE = "http://localhost:3001/api";
const API_KEY = "BV4G310-X5X48XR-K7YNKR0-XBD714E";

const wsSelect = document.getElementById('ws');
const fileInput = document.getElementById('file');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
let workspaces = [];

function refreshBtn() {
  btn.disabled = !(fileInput.files.length && wsSelect.value);
}

async function loadWorkspaces() {
  try {
    const res = await fetch(`${API_BASE}/v1/workspaces`, { headers: { 'Authorization': `Bearer ${API_KEY}` } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    workspaces = data.workspaces || [];
    if (!workspaces.length) throw new Error('没有可用的工作区。');
    wsSelect.innerHTML = workspaces.map(w => `<option value="${w.slug}">${w.name || w.slug}</option>`).join('');
    wsSelect.disabled = false;
    status.className = 'info';
    status.textContent = '请选择工作区和文件。';
    refreshBtn();
  } catch (e) {
    status.className = 'err';
    status.textContent = '加载工作区失败：' + (e && e.message ? e.message : e);
  }
}

wsSelect.addEventListener('change', refreshBtn);
fileInput.addEventListener('change', () => {
  refreshBtn();
  if (fileInput.files.length) {
    status.className = 'info';
    status.textContent = '已选择：' + fileInput.files[0].name;
  }
});

btn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  const slug = wsSelect.value;
  if (!file || !slug) return;
  btn.disabled = true;
  try {
    status.className = 'info';
    status.textContent = '上传中…';
    const form = new FormData();
    form.append('file', file);

    const upRes = await fetch(`${API_BASE}/v1/document/upload`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${API_KEY}` },
      body: form
    });
    const text = await upRes.text();
    let data;
    try { data = JSON.parse(text); } catch { data = null; }
    if (!upRes.ok || !data || data.success === false) {
      const msg = (data && (data.error || JSON.stringify(data))) || text || ('HTTP ' + upRes.status);
      throw new Error('上传失败：' + msg);
    }
    const d = (data.documents && data.documents[0]) || {};
    if (!d.location) throw new Error('上传成功但未返回文档位置，无法嵌入。');

    // 显式嵌入到所选工作区
    status.textContent = '上传完成，正在向量化嵌入…';
    const embRes = await fetch(`${API_BASE}/v1/workspace/${slug}/update-embeddings`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ adds: [d.location], deletes: [] })
    });
    const embText = await embRes.text();
    let embData;
    try { embData = JSON.parse(embText); } catch { embData = null; }
    if (!embRes.ok) {
      const msg = (embData && (embData.error || JSON.stringify(embData))) || embText || ('HTTP ' + embRes.status);
      throw new Error('嵌入失败：' + msg);
    }

    status.className = 'ok';
    status.textContent =
      '上传并嵌入成功 ✓\n' +
      '工作区：' + (wsSelect.options[wsSelect.selectedIndex].text) + '\n' +
      '标题：' + (d.title || '-') + '\n' +
      '字数：' + (d.wordCount ?? '-') + '\n' +
      'Token 估算：' + (d.token_count_estimate ?? '-') + '\n' +
      '位置：' + (d.location || '-');
  } catch (e) {
    status.className = 'err';
    status.textContent = '请求失败：' + (e && e.message ? e.message : e);
  } finally {
    btn.disabled = false;
  }
});

loadWorkspaces();
</script>
</body>
</html>
